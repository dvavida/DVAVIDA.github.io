<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DVAVIDA - Clock and Date</title>

<!-- FAVICON -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="/images/icons/favicon-48x48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/images/icons/favicon-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/images/icons/favicon-512x512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/icons/apple-touch-icon-180x180.png">
  <link rel="manifest" href="/manifest.json">

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #b00000, #003cff);
    font-family: Arial, sans-serif;
}

.clock {
    background: rgba(0,0,0,0.35);
    padding: 40px 70px;
    border-radius: 20px;
    border: 3px solid white;
    box-shadow: 0 0 30px rgba(255,255,255,0.4);
    text-align: center;
}

#date {
    color: white;
    font-size: 55px;
    font-weight: bold;
    letter-spacing: 3px;
}

#time {
    color: white;
    font-size: 35px;
    margin-top: 15px;
}
</style>

</head>

<body>

<div class="clock">
    <div id="date"></div>
    <div id="time"></div>
</div>

<script>
function updateClock() {
    let now = new Date();

    let day = String(now.getDate()).padStart(2,'0');
    let month = String(now.getMonth()+1).padStart(2,'0');
    let year = now.getFullYear();

    let hour = String(now.getHours()).padStart(2,'0');
    let minute = String(now.getMinutes()).padStart(2,'0');
    let second = String(now.getSeconds()).padStart(2,'0');

    document.getElementById("date").innerHTML =
        day + "." + month + "." + year;

    document.getElementById("time").innerHTML =
        hour + ":" + minute + ":" + second;
}

updateClock();
setInterval(updateClock,1000);
</script>

</body>
</html>
